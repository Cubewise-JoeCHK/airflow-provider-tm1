name: Build & test Airflow

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main", "feature/*"]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: lint + unit tests. No docker stack, no tailnet secrets.
  # Runs on every push and every PR (including fork PRs), giving contributors
  # immediate feedback. uv-cached for speed.
  # ---------------------------------------------------------------------------
  fast:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    # Same trust boundary as the integration job below: for fork PRs, only run
    # via pull_request_target with the 'safe to test' label.
    if: |
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test') && github.event.pull_request.head.repo.fork)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Checkout (fork PR via pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # This job has NO secrets access and runs only lint + unit tests against
          # the fork's source. pull_request_target uses the base branch's workflow
          # file, so the fork cannot change which steps run. The opt-in is required
          # by actions/checkout@v4 to check out fork code in this event.
          allow-unsafe-pr-checkout: true

      - name: Checkout (push / local PR / dispatch)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (black + isort via pre-commit)
        run: uv run pre-commit run --all-files --hook-stage commit

      - name: Unit tests
        run: uv run pytest tests/unit -q

  # ---------------------------------------------------------------------------
  # Integration tests: the Airflow stack + an EXTERNAL persistent TM1 instance.
  # TM1 runs as a long-lived container on the lab box (airflow-provider-ci)
  # reachable over the tailnet via Caddy, so CI no longer pulls/starts its own
  # 2.1GB TM1 image. This makes the job minutes faster and fully deterministic.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.display-name }})
    needs: fast
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test') && github.event.pull_request.head.repo.fork)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "2.11"
            base-image: "apache/airflow:2.11.0-python3.11"
            display-name: "Airflow 2.11"
          - airflow-version: "3.0"
            base-image: "apache/airflow:3.0.6-python3.11"
            display-name: "Airflow 3.0"

    steps:
      - name: Checkout (fork PR via pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # pull_request_target runs the BASE branch's workflow file (this file),
          # so a fork cannot alter which steps execute. Checking out the fork's
          # source here is therefore safe: only trusted steps (below) run, and
          # the 'safe to test' label is a maintainer's explicit opt-in. This is
          # the documented pattern for running CI on forks that need secrets.
          allow-unsafe-pr-checkout: true

      - name: Checkout (push / local PR / dispatch)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build provider wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Verify the persistent TM1 CI instance is reachable
        env:
          TM1_HOST: airflow-provider-ci.joechowhk.internal
        run: |
          # The TM1 CI instance is a long-lived container on the lab box, proxied
          # by Caddy at this tailnet hostname. Poll until its model is loaded.
          echo "Probing TM1 at http://${TM1_HOST}/ ..."
          deadline=$(( $(date +%s) + 120 ))
          while :; do
            if name=$(curl -sf -u admin: "http://${TM1_HOST}/api/v1/Configuration/ServerName/\$value" 2>/dev/null) && [ -n "$name" ]; then
              echo "✅ TM1 reachable. ServerName: ${name}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Could not reach TM1 at ${TM1_HOST} within 2 minutes."
              exit 1
            fi
            printf '.'; sleep 3
          done

      - name: Build & start Airflow stack (no TM1 container)
        env:
          AIRFLOW_BASE_IMAGE: ${{ matrix.base-image }}
          TM1_HOST: airflow-provider-ci.joechowhk.internal
        run: |
          cd tests_integration
          echo -e "AIRFLOW_UID=$(id -u)" > .env
          echo -e "AIRFLOW_BASE_IMAGE=${AIRFLOW_BASE_IMAGE}" >> .env
          docker compose up -d airflow-init
          # Start only Airflow services — TM1 is external (no tm1 service here).
          docker compose up -d --build airflow-webserver airflow-scheduler airflow-worker airflow-triggerer

      - name: Add TM1 connection to Airflow (external instance)
        env:
          TM1_HOST: airflow-provider-ci.joechowhk.internal
        run: |
          DOCKID=$(docker ps -q --filter "name=tests_integration-airflow-worker-1")
          TM1_CONN=$(docker exec "$DOCKID" airflow connections list 2>/dev/null | grep tm1_conn) || true
          if [ -z "$TM1_CONN" ]; then
            # host = the tailnet hostname; port 80 (Caddy proxies to TM1's 12354)
            docker exec "$DOCKID" airflow connections add 'tm1_conn' \
              --conn-json '{"conn_type": "tm1", "host": "'"${TM1_HOST}"'", "login": "admin", "schema": "", "port": 80, "extra": {"ssl": "False"}}'
            echo "Added tm1_conn -> http://${TM1_HOST}:80"
          else
            echo "Connection already added: $TM1_CONN"
          fi

      - name: Run integration tests
        run: |
          cd tests_integration
          pip install pytest
          pytest integration_test.py -s

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-airflow-${{ matrix.airflow-version }}
          path: |
            tests_integration/logs/*

      - name: Stop docker containers
        if: always()
        run: |
          cd tests_integration
          docker compose down
