name: Build & test Airflow

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main", "feature/*"]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: lint + unit tests. No docker stack, no tailnet secrets.
  # Runs on every push and every PR (including fork PRs), giving contributors
  # immediate feedback. uv-cached for speed.
  # ---------------------------------------------------------------------------
  fast:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    # Same trust boundary as the integration job below: for fork PRs, only run
    # via pull_request_target with the 'safe to test' label.
    if: |
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test') && github.event.pull_request.head.repo.fork)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10

    steps:
      - name: Checkout (fork PR via pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # This job has NO secrets access and runs only lint + unit tests against
          # the fork's source. pull_request_target uses the base branch's workflow
          # file, so the fork cannot change which steps run. The opt-in is required
          # by actions/checkout@v4 to check out fork code in this event.
          allow-unsafe-pr-checkout: true

      - name: Checkout (push / local PR / dispatch)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (black + isort via pre-commit)
        run: uv run pre-commit run --all-files --hook-stage commit

      - name: Unit tests
        run: uv run pytest tests/unit -q

  # ---------------------------------------------------------------------------
  # Integration tests: the full TM1 + Airflow docker-compose stack.
  # Requires the private tailnet TM1 image, so it's secrets-gated.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.display-name }})
    needs: fast
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test') && github.event.pull_request.head.repo.fork)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - airflow-version: "2.11"
            base-image: "apache/airflow:2.11.0-python3.11"
            display-name: "Airflow 2.11"
          - airflow-version: "3.0"
            base-image: "apache/airflow:3.0.6-python3.11"
            display-name: "Airflow 3.0"

    steps:
      - name: Checkout (fork PR via pull_request_target)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # pull_request_target runs the BASE branch's workflow file (this file),
          # so a fork cannot alter which steps execute. Checking out the fork's
          # source here is therefore safe: only trusted steps (below) run, and
          # the 'safe to test' label is a maintainer's explicit opt-in. This is
          # the documented pattern for running CI on forks that need secrets.
          allow-unsafe-pr-checkout: true

      - name: Checkout (push / local PR / dispatch)
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build provider wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Pull Airflow base image (from Docker Hub, before tailnet)
        env:
          AIRFLOW_BASE_IMAGE: ${{ matrix.base-image }}
        run: |
          # Pull the public Airflow image BEFORE connecting to Tailscale. Once the
          # VPN is up, Docker Hub traffic can route through the tailnet (slow + NAT'd).
          # Images persist on disk across the daemon restart below, so this pull
          # survives the later insecure-registry reconfiguration.
          docker pull "${AIRFLOW_BASE_IMAGE}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Docker for private registry
        env:
          TM1_REGISTRY: ${{ vars.TM1_REGISTRY }}
        run: |
          # The TM1 test image is served from a private HTTP registry on the tailnet.
          # Trust it as an insecure registry so docker compose can pull over plain HTTP.
          REGISTRY="${TM1_REGISTRY:-100.109.186.25:5100}"
          REGISTRY_HOST="${REGISTRY%%:*}"
          echo "Registry: ${REGISTRY} (host: ${REGISTRY_HOST})"

          sudo tailscale ping "${REGISTRY_HOST}" || true

          sudo mkdir -p /etc/docker
          echo "{\"insecure-registries\": [\"${REGISTRY}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl daemon-reload
          sudo systemctl restart docker

          # confirm the Airflow image survived the daemon restart
          docker image inspect "${{ matrix.base-image }}" >/dev/null \
            && echo "Airflow image present after restart" \
            || echo "::warning::Airflow image lost after docker restart"

          curl -fsS "http://${REGISTRY}/v2/_catalog"

      - name: Resolve TM1 image ref
        id: tm1-image
        env:
          TM1_REGISTRY: ${{ vars.TM1_REGISTRY }}
        run: |
          REGISTRY="${TM1_REGISTRY:-100.109.186.25:5100}"
          IMAGE="${REGISTRY}/tm1-linux:24Retail"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          # cache key: stable unless the registry/tag changes. The image is large
          # (~2.1GB) and rarely changes, so a registry+tag key maximizes hits.
          echo "key=tm1-image-${REGISTRY//\//-}-24Retail" >> "$GITHUB_OUTPUT"

      - name: Restore TM1 image from cache
        id: tm1-cache
        uses: actions/cache@v4
        with:
          path: /tmp/tm1-image.tar
          key: ${{ steps.tm1-image.outputs.key }}

      - name: Load cached TM1 image (if present)
        if: steps.tm1-cache.outputs.cache-hit == 'true'
        run: |
          echo "Cache HIT — loading TM1 image from tarball (skips the ~2.1GB tailnet pull) ..."
          docker load --input /tmp/tm1-image.tar

      # --- Airflow stack + TM1 pull run concurrently (different bottlenecks) ---
      # Airflow image build is CPU-bound; the TM1 pull is network-bound. Decoupling
      # them lets the two overlap on a cache miss instead of the slow TM1 pull
      # serializing behind the entire compose up.

      - name: Start TM1 image pull in background (cache miss only)
        if: steps.tm1-cache.outputs.cache-hit != 'true'
        env:
          TM1_IMAGE: ${{ steps.tm1-image.outputs.image }}
        run: |
          # Pull the 2.1GB TM1 image from the tailnet registry in the background so
          # the Airflow stack build (next step) proceeds in parallel. The PID is
          # stored so we can wait for completion before 'docker compose up tm1'.
          echo "Cache MISS — pulling TM1 image in background ..."
          nohup docker pull "${TM1_IMAGE}" > /tmp/tm1-pull.log 2>&1 &
          echo $! > /tmp/tm1-pull.pid
          echo "TM1 pull started as PID $(cat /tmp/tm1-pull.pid)"

      - name: Build & start Airflow stack (excludes TM1)
        env:
          AIRFLOW_BASE_IMAGE: ${{ matrix.base-image }}
        run: |
          cd tests_integration
          echo -e "AIRFLOW_UID=$(id -u)" > .env
          echo -e "AIRFLOW_BASE_IMAGE=${AIRFLOW_BASE_IMAGE}" >> .env
          # Build the custom Airflow image + run airflow-init (DB migration), then
          # start the Airflow services that DON'T depend on TM1 (webserver,
          # scheduler, worker, triggerer, redis, postgres). TM1 is started separately
          # below once its image is ready, so its slow pull never blocks this build.
          docker compose up -d airflow-init
          docker compose up -d --build airflow-webserver airflow-scheduler airflow-worker airflow-triggerer

      - name: Wait for TM1 pull (cache miss) and start TM1
        env:
          TM1_IMAGE: ${{ steps.tm1-image.outputs.image }}
        run: |
          if [ -f /tmp/tm1-pull.pid ]; then
            PID=$(cat /tmp/tm1-pull.pid)
            echo "Waiting for background TM1 pull (PID $PID) to finish ..."
            tail --pid="$PID" -f /dev/null
            if ! wait "$PID"; then
              echo "::error::TM1 image pull failed. Pull log:"
              cat /tmp/tm1-pull.log
              exit 1
            fi
            echo "TM1 image pull complete."
          else
            echo "TM1 image was loaded from cache (no background pull)."
          fi
          docker image inspect "${TM1_IMAGE}" >/dev/null \
            || { echo "::error::TM1 image not present after pull/cache"; exit 1; }
          cd tests_integration
          docker compose up -d --no-deps tm1

      - name: Save TM1 image to cache (on cache miss)
        if: always() && steps.tm1-cache.outputs.cache-hit != 'true'
        env:
          TM1_IMAGE: ${{ steps.tm1-image.outputs.image }}
        run: |
          # Only runs the first time (or when the image tag changes). Runs with
          # always() so a cache is still seeded even if a downstream step failed —
          # as long as the image itself was pulled.
          if ! docker image inspect "${TM1_IMAGE}" >/dev/null 2>&1; then
            echo "Image not present locally — nothing to cache."
            exit 0
          fi
          echo "Cache MISS — saving TM1 image for next run ..."
          docker save --output /tmp/tm1-image.tar "${TM1_IMAGE}"
          ls -lh /tmp/tm1-image.tar

      - name: Wait for TM1 to be ready
        run: |
          echo "Waiting for TM1 model to finish loading (cold boot can take minutes) ..."
          TM1_CONTAINER="tm1"
          deadline=$(( $(date +%s) + 900 ))   # 15 min cap
          while :; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$TM1_CONTAINER" 2>/dev/null || echo "missing")"
            case "$status" in
              healthy) echo "TM1 is healthy (model loaded)."; exit 0 ;;
              unhealthy) echo "::error::TM1 container is unhealthy. Check: docker logs $TM1_CONTAINER"; exit 1 ;;
              missing) echo "::error::TM1 container $TM1_CONTAINER not found."; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for TM1 health (last status: $status)."
              exit 1
            fi
            printf '.'
            sleep 5
          done

      - name: Add TM1 connection to Airflow
        run: |
          DOCKID=$(docker ps -q --filter "name=tests_integration-airflow-worker-1")
          TM1_CONN=$(docker exec $DOCKID airflow connections list 2>/dev/null | grep tm1_conn) || true
          if [ -z "$TM1_CONN" ]; then
            docker exec $DOCKID airflow connections add 'tm1_conn' --conn-json '{"conn_type": "tm1", "host": "tm1", "login": "admin", "schema": "", "port": 5360, "extra": {"ssl": "False"}}'
          else
            echo "Connection already added: $TM1_CONN"
          fi

      - name: Run integration tests
        run: |
          cd tests_integration
          pip install pytest
          pytest integration_test.py -s

      - name: Archive test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-airflow-${{ matrix.airflow-version }}
          path: |
            tests_integration/logs/*
            tests_integration/tm1models/24Retail/tm1server.log
            tests_integration/tm1models/24Retail/tm1processerror*.log

      - name: Stop docker containers
        if: always()
        run: |
          cd tests_integration
          docker compose down
